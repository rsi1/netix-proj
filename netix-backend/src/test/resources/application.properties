# Test profile overrides
server.port=0

# Use in-memory H2 DB during tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;INIT=RUNSCRIPT FROM 'classpath:schema.sql'
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Auto-manage schema in tests
spring.jpa.hibernate.ddl-auto=update

# Quote identifiers to avoid reserved keywords like 'user'
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Ensure schema.sql runs before JPA DDL
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.schema-locations=classpath:schema.sql