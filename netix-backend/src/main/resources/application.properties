spring.config.import=optional:file:.env
server.port=${SPRING_PORT:8080}
spring.application.name=netix-backend
spring.datasource.url=${JDBC_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
edesky.api.key=${EDESKY_API_KEY:}          // nastaveni pro desky
edesky.api.url=https://api.edesky.cz/v1/  // nastaveni pro desky
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.cz.netix.netixbackend=DEBUG

