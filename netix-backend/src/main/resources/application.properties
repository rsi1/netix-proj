server.port=${SPRING_PORT:8080}
spring.application.name=netix-backend

spring.datasource.url=${JDBC_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# === RUIAN databáze (hlavní) ===
spring.datasource.ruian.url=jdbc:mariadb://192.168.3.31:3306/demo
spring.datasource.ruian.username=${DB_USERNAME}
spring.datasource.ruian.password=${DB_PASSWORD}
spring.datasource.ruian.driver-class-name=org.mariadb.jdbc.Driver

# === ČÍSELNÍKY databáze ===
spring.datasource.ciselniky.url=jdbc:mariadb://192.168.3.31:3306/ciselniky
spring.datasource.ciselniky.username=${DB_USERNAME}
spring.datasource.ciselniky.password=${DB_PASSWORD}
spring.datasource.ciselniky.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

//nastaveni pro desky
edesky.api.key=${EDESKY_API_KEY}
edesky.api.url=https://api.edesky.cz/v1/
edesky.api.url=https://edesky.cz/api/v1/documents
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=DEBUG

logging.level.org.springframework.web=DEBUG
logging.level.cz.netix.netixbackend=DEBUG

