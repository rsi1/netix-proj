<!DOCTYPE html>
<html lang="cs" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title != null ? title : 'RX Admin'}">RX Admin</title>

  <!-- Bootstrap 5 (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body { background: #f6f7fb; }
    .sidebar { min-height: 100vh; }
    .brand-badge { font-weight: 700; letter-spacing: .5px; }
  </style>
</head>
<body>

<div class="container-fluid">
  <div class="row">

    <!-- Sidebar -->
    <aside class="col-12 col-md-3 col-lg-2 bg-white border-end sidebar p-3">
      <div class="d-flex align-items-center gap-2 mb-4">
        <span class="badge text-bg-dark brand-badge">RX</span>
        <div class="fw-semibold">Admin</div>
      </div>

      <nav class="nav nav-pills flex-column gap-1">
        <a class="nav-link"
           th:classappend="${activeMenu}=='persons' ? ' active fw-semibold' : ''"
           th:href="@{/admin/persons}">
          Persons
        </a>
      </nav>

      <hr class="my-4">
      <div class="small text-muted">NETIX / RX backend</div>
    </aside>

    <!-- Main -->
    <main class="col-12 col-md-9 col-lg-10 p-4">

      <header class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h4 mb-0" th:text="${title}">Dashboard</h1>

        <form th:action="@{/logout}" method="post">
          <button type="submit" class="btn btn-outline-secondary btn-sm">Logout</button>
        </form>
      </header>

      <div th:if="${flashMsg}" class="alert alert-success" th:text="${flashMsg}"></div>

      <!-- sem se vloží obsah stránky -->
      <div th:replace="~{__${content}__}"></div>

    </main>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
