<section th:fragment="content" xmlns:th="http://www.thymeleaf.org">

  <h2 class="h5 mb-3" th:text="${person != null and person.id != null ? 'Edit person' : 'New person'}">
    Person
  </h2>

  <form th:action="@{/admin/persons/save}" method="post" class="card p-3">
    <input type="hidden" name="id" th:value="${person.id}"/>

    <div class="mb-3">
      <label class="form-label">Name</label>
      <input class="form-control" name="name" th:value="${person.name}" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Email</label>
      <input class="form-control" name="email" th:value="${person.email}">
    </div>

    <div class="d-flex gap-2">
      <button class="btn btn-primary" type="submit">Save</button>
      <a class="btn btn-outline-secondary" th:href="@{/admin/persons}">Back</a>
    </div>
  </form>

</section>
