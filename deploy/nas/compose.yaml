services:
  netix-backend:
    image: eclipse-temurin:21-jre
    container_name: netix-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    volumes:
      - ./app:/app:ro
      - ./config/application-prod.properties:/config/application-prod.properties:ro
      - ./logs:/logs
    working_dir: /app
    command:
      [
        "java",
        "-jar",
        "/app/netix-backend.jar",
        "--spring.config.additional-location=file:/config/application-prod.properties"
      ]